name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VITE_USE_OFFICIAL_ICONS: 'false'
      BATTLE_E2E_PRODUCTION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:engine
      - run: npm run test:server
      - run: npm run build
      - name: Run functional E2E tests
        run: npx playwright test --grep-invert 'visual|最大48体'
      - run: npm run test:visual
        if: success() || failure()
      # Shared runners are not the reference machine for the 30fps target.
      - name: Measure rendering performance
        run: npx playwright test --grep '最大48体'
        if: success() || failure()
        continue-on-error: true
      - name: Save rendering measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: rendering-performance
          path: output/render-performance-*.json
          retention-days: 7
      - name: Build GitHub Pages version
        run: npm run build:pages
      - name: Verify GitHub Pages version
        run: npm run test:pages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
            output/render-performance-*.json
          retention-days: 7
